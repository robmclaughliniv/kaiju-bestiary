# API Lambda code deploy for kaiju-bestiary.
# Terraform created the function with a placeholder and ignores code drift;
# this workflow ships real code via `lambda update-function-code`.
#
# Required repo variables (set by bootstrap.sh):
#   AWS_DEPLOY_ROLE_ARN, AWS_REGION, LAMBDA_FUNCTION_NAME

name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
  workflow_dispatch:

permissions:
  id-token: write # OIDC
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Build & package Lambda
        working-directory: api
        run: npm run package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: kaiju-bestiary-api-deploy

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --zip-file "fileb://api/api.zip" \
            --publish
